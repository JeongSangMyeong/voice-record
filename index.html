<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f6df6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="VoiceScribe" />
<title>VoiceScribe — 음성을 텍스트로</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --text:#16181d; --muted:#667;
    --line:#e2e5ea; --accent:#2f6df6; --accent-weak:#e8f0ff;
    --warn:#b7791f; --err:#c0392b; --ok:#12855a; --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#14161a; --panel:#1c1f25; --text:#e8eaee; --muted:#9aa3b2;
           --line:#2c313a; --accent:#5b8cff; --accent-weak:#1e2a44;
           --warn:#e0a83a; --err:#ef6d5e; --ok:#35c48c; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:20px 16px calc(48px + env(safe-area-inset-bottom));
    background:var(--bg); color:var(--text); line-height:1.6;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .drop{border:2px dashed var(--line);border-radius:var(--radius);padding:28px 16px;text-align:center;cursor:pointer}
  .drop:active,.drop.over{border-color:var(--accent);background:var(--accent-weak)}
  .drop b{font-size:16px} .drop small{display:block;color:var(--muted);margin-top:6px}
  label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  select{width:100%;padding:12px 10px;border-radius:10px;border:1px solid var(--line);
         background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
  button{padding:14px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
         color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;width:100%}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.rec{background:var(--err);color:#fff;border-color:var(--err)}
  button:disabled{opacity:.45}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row>button{width:auto;flex:1;min-width:140px}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  .status{font-size:13px;color:var(--muted);margin-top:8px}
  .hidden{display:none!important}
  .note{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .note.warn{background:rgba(183,121,31,.13);color:var(--warn)}
  .note.err{background:rgba(192,57,43,.13);color:var(--err);white-space:pre-wrap}
  .note.info{background:var(--accent-weak);color:var(--accent)}
  #out{width:100%;min-height:220px;padding:12px;border-radius:10px;border:1px solid var(--line);
       background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;line-height:1.7;resize:vertical}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
  .meta b{color:var(--text)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;line-height:1.8}
  #recTime{font-variant-numeric:tabular-nums;color:var(--err);font-weight:700;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ VoiceScribe</h1>
  <p class="sub">녹음을 텍스트로 바꿔 드립니다. <b>변환은 이 기기 안에서만</b> 이루어지고 녹음이 어디로도 전송되지 않습니다.</p>

  <div id="insecure" class="note err hidden"></div>
  <div id="firstRun" class="note info">
    처음 한 번만 음성인식 모델을 내려받습니다(수십 MB). 그 뒤로는 저장되어 빠르게 열립니다.
  </div>

  <div class="panel">
    <div id="drop" class="drop">
      <b>녹음 파일 고르기</b>
      <small>m4a · mp3 · wav · mp4 등</small>
      <input id="file" type="file" accept="audio/*,video/*" class="hidden" />
    </div>
    <div class="row" style="margin-top:12px">
      <button id="recBtn">⏺ 마이크로 녹음</button>
      <span id="recTime" class="hidden">0:00</span>
    </div>
    <div id="picked" class="status"></div>
  </div>

  <div class="panel">
    <div class="grid">
      <div>
        <label class="f" for="lang">언어</label>
        <select id="lang">
          <option value="ko" selected>한국어</option>
          <option value="en">영어</option>
          <option value="ja">일본어</option>
          <option value="zh">중국어</option>
          <option value="es">스페인어</option>
          <option value="fr">프랑스어</option>
          <option value="de">독일어</option>
          <option value="vi">베트남어</option>
          <option value="auto">자동 감지</option>
        </select>
      </div>
      <div>
        <label class="f" for="model">받아쓰기 엔진</label>
        <select id="model">
          <optgroup label="한국어 · 일본어 · 중국어 · 영어">
            <option value="sensevoice-small" selected>✅ SenseVoice — 권장 (가장 정확하고 빠름)</option>
          </optgroup>
          <optgroup label="그 밖의 언어 (프랑스어·독일어·베트남어 등)">
            <option value="onnx-community/whisper-large-v3-turbo">Whisper 큼 — 정확하지만 느림</option>
            <option value="onnx-community/whisper-small">Whisper 보통</option>
            <option value="onnx-community/whisper-base">Whisper 작음 — 빠름</option>
            <option value="onnx-community/whisper-tiny">Whisper 아주 작음 — 가장 빠름</option>
          </optgroup>
        </select>
        <div class="status" style="margin-top:6px">
          한국어면 <b>맨 위 SenseVoice</b> 그대로 두세요. 처음 한 번만 받고 이후엔 저장됩니다.
        </div>
      </div>
    </div>
    <label class="chip-row" style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;cursor:pointer">
      <input type="checkbox" id="diarize" checked style="width:20px;height:20px" />
      화자 구분하기 (누가 말했는지 나눠서 표시 · 처음 한 번 26MB 더 받음)
    </label>
    <label class="chip-row" id="notifyRow" style="display:none;align-items:center;gap:8px;margin-top:10px;font-size:15px;cursor:pointer">
      <input type="checkbox" id="notify" style="width:20px;height:20px" />
      휴대폰을 다른 데 써도 계속 돌리고, 끝나면 알림 받기
    </label>
    <div id="notifyNote" class="status hidden" style="margin-top:6px"></div>
    <button id="go" class="primary" style="margin-top:14px" disabled>받아쓰기 시작</button>
  </div>

  <div id="prog" class="panel hidden">
    <div class="bar"><i id="fill"></i></div>
    <div class="status" id="statusText">준비 중…</div>
    <button id="stop" style="margin-top:12px;border-color:var(--err);color:var(--err)">
      ■ 중지
    </button>
  </div>

  <div id="err" class="note err hidden"></div>

  <div id="result" class="panel hidden">
    <div class="meta" id="rmeta"></div>
    <textarea id="out" readonly></textarea>
    <div class="row" style="margin-top:12px">
      <button id="copy">📋 복사</button>
      <button id="save">⬇ 파일로 저장 · 공유</button>
    </div>
  </div>

  <p class="foot">
    <span id="devinfo"></span><br />
    변환은 이 기기 안에서만 이루어집니다.<br />
    녹음 파일이 서버로 전송되지 않습니다.
  </p>
</div>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="받아쓰기" />
<script src="coi-serviceworker.js"></script>
<script type="module">
"use strict";
const $ = (id) => document.getElementById(id);
const SAMPLE_RATE = 16000;
let picked = null, recorder = null, chunks = [], timer = null, recStart = 0, worker = null;
let lastResult = null;
const downloaded = new Map();
const downloadBytes = new Map();
let stallTimer = null;
let currentPhase = "";
let profileKey = "wasm";
let senseVoiceModel = "sensevoice-small";
let senseVoiceSizeMB = null;
const SENSEVOICE_LANGS = ["auto", "ko", "en", "ja", "zh", "yue"];
let diarizeSkipped = false;
let modelSizes = null;
let planTotal = 0;
let onMainThread = false;
let cancelled = false;
let workerFailed = false;      // 작업자가 한 번 실패하면 이후에는 바로 우회한다
let mainThreadBusy = false;
// 파일을 고칠 때마다 올린다. 브라우저가 예전 파일을 쓰지 않게 하는 용도.
const APP_VERSION = "23";

/* ---------- 보안 연결 확인 (마이크는 https 에서만 된다) ---------- */
if (!window.isSecureContext) {
  const box = $("insecure");
  box.classList.remove("hidden");
  box.textContent =
    "이 페이지가 보안 연결(https)이 아니라서 마이크 녹음을 쓸 수 없습니다.\n" +
    "녹음 파일을 골라서 올리는 것은 그대로 됩니다.";
}

/* ---------- 유틸 ---------- */
const fmtTime = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, x = s % 60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`
           : `${m}:${String(x).padStart(2,"0")}`;
};
const fmtSize = (b) => b < 1048576 ? `${(b/1024)|0} KB` : `${(b/1048576).toFixed(1)} MB`;

function setFile(f) {
  picked = f;
  $("picked").textContent = f ? `선택됨: ${f.name} (${fmtSize(f.size)})` : "";
  $("go").disabled = !f;
}

/* ---------- 파일 고르기 ---------- */
$("drop").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => e.target.files[0] && setFile(e.target.files[0]));
["dragenter","dragover"].forEach(ev => $("drop").addEventListener(ev, (e) => {
  e.preventDefault(); $("drop").classList.add("over");
}));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, (e) => {
  e.preventDefault(); $("drop").classList.remove("over");
}));
$("drop").addEventListener("drop", (e) => e.dataTransfer.files[0] && setFile(e.dataTransfer.files[0]));

/* ---------- 마이크 녹음 ---------- */
$("recBtn").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") {
    alert("이 브라우저에서는 녹음을 지원하지 않습니다. 녹음 앱으로 녹음한 파일을 올려 주세요.");
    return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { alert("마이크 권한이 필요합니다: " + e.message); return; }

  chunks = [];
  // 아이폰 사파리는 audio/mp4 를 만든다. 지원하는 형식을 골라 준다.
  const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"]
    .find(m => MediaRecorder.isTypeSupported(m)) || "";
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(timer);
    $("recBtn").textContent = "⏺ 마이크로 녹음";
    $("recBtn").classList.remove("rec");
    $("recTime").classList.add("hidden");
    const type = recorder.mimeType || "audio/mp4";
    const ext = type.includes("webm") ? "webm" : "m4a";
    const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
    setFile(new File([new Blob(chunks, { type })], `녹음-${stamp}.${ext}`, { type }));
  };
  recorder.start();
  recStart = Date.now();
  $("recBtn").textContent = "⏹ 녹음 중지";
  $("recBtn").classList.add("rec");
  $("recTime").classList.remove("hidden");
  timer = setInterval(() => $("recTime").textContent = fmtTime((Date.now()-recStart)/1000), 250);
});

/* ---------- 오디오 디코딩 (16kHz 모노로) ---------- */
async function toMono16k(file) {
  const buffer = await file.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const decodeCtx = new Ctx();
  let decoded;
  try {
    decoded = await decodeCtx.decodeAudioData(buffer);
  } catch {
    throw new Error("이 오디오 형식을 읽지 못했습니다. m4a·mp3·wav 파일을 사용해 주세요.");
  } finally {
    decodeCtx.close();
  }
  if (decoded.sampleRate === SAMPLE_RATE && decoded.numberOfChannels === 1) {
    return decoded.getChannelData(0);
  }
  // 16kHz 모노로 다시 그린다.
  const frames = Math.ceil(decoded.duration * SAMPLE_RATE);
  const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const offline = new Offline(1, frames, SAMPLE_RATE);
  const source = offline.createBufferSource();
  source.buffer = decoded;
  source.connect(offline.destination);
  source.start();
  return (await offline.startRendering()).getChannelData(0);
}

/* ---------- 실행 ---------- */
/** 이 기기가 빠른 모드(WebGPU)를 쓸 수 있는지 미리 확인해 안내한다. */
let hasWebGPU = null;
async function checkDevice() {
  try {
    hasWebGPU = "gpu" in navigator && !!(await navigator.gpu.requestAdapter());
  } catch {
    hasWebGPU = false;
  }
  // 지금 이 기기가 어떤 조건인지 그대로 보여 준다. 느릴 때 원인을 알 수 있다.
  const cores = navigator.hardwareConcurrency || 0;
  const threads = window.crossOriginIsolated ? Math.max(1, Math.min(4, cores)) : 1;
  // 내려받는 용량은 기기(그래픽 가속 여부)에 따라 다르다. 실제 값을 읽어 온다.
  try {
    const eng = await import(`./engine.js?v=${APP_VERSION}`);
    profileKey = await eng.pickProfileKey(hasWebGPU ? "webgpu" : "wasm");
    modelSizes = eng.MODEL_PROFILES;
    senseVoiceModel = eng.SENSEVOICE_MODEL;
    senseVoiceSizeMB = eng.SENSEVOICE_SIZE_MB;
  } catch {
    /* 못 읽어도 안내 문구만 덜 자세해질 뿐이다 */
  }
  $("devinfo").textContent =
    `이 기기: ${hasWebGPU ? "빠른 모드(WebGPU) 사용 가능" : "일반 모드"}` +
    ` · CPU ${cores || "?"}개 중 ${threads}개 사용` +
    (window.crossOriginIsolated ? "" : " (여러 개를 쓰려면 새로고침이 한 번 필요합니다)");
  updateModelHint();
}

/** 이 기기에서 이 모델을 고르면 실제로 몇 MB 를 받는지. 모르면 null. */
function sizeForSelected() {
  if ($("model").value === senseVoiceModel) return senseVoiceSizeMB;
  return modelSizes?.[$("model").value]?.[profileKey]?.sizeMB ?? null;
}

function updateModelHint() {
  const sense = $("model").value === senseVoiceModel;
  const big = !sense && $("model").value.includes("large");
  const mb = sizeForSelected();
  const sizeNote = mb === null ? "" : ` (약 ${mb}MB)`;
  const box = $("firstRun");
  box.classList.remove("hidden");

  if (big && hasWebGPU === false) {
    box.className = "note warn";
    box.innerHTML =
      "이 기기는 <b>빠른 모드(WebGPU)를 지원하지 않습니다.</b> " +
      "가장 정확한 모델은 매우 느리고 휴대폰이 뜨거워질 수 있습니다.<br />" +
      "<b>보통</b> 을 권합니다. 그래도 쓰시려면 짧은 녹음으로 먼저 시험해 보세요.";
    return;
  }
  if (sense) {
    const lang = $("lang").value;
    const known = SENSEVOICE_LANGS.includes(lang);
    box.className = known ? "note info" : "note warn";
    box.innerHTML = known
      ? `한국어에 가장 정확하고 가장 빠른 조합입니다${sizeNote}. ` +
        "처음 한 번만 받고 그 뒤로는 저장됩니다."
      : "이 엔진은 <b>한국어·영어·일본어·중국어·광둥어</b>만 압니다.<br />" +
        "다른 언어는 위에서 <b>그 밖의 언어</b> 로 바꿔 주세요.";
    return;
  }
  box.className = "note info";
  box.innerHTML = big
    ? `가장 정확한 모델을 내려받습니다<b>${sizeNote}</b>. ` +
      "<b>와이파이</b>에서, 받는 동안 <b>이 화면을 그대로 두세요.</b> " +
      "다른 앱으로 나가면 중단됩니다." +
      (hasWebGPU ? " (이 기기는 빠른 모드를 지원합니다 ✓)" : "")
    : `처음 한 번만 음성인식 모델을 내려받습니다${sizeNote}. 그 뒤로는 저장되어 빠르게 열립니다.` +
      (hasWebGPU ? " 이 기기는 빠른 모드를 지원합니다 ✓" : "");
}

$("model").addEventListener("change", updateModelHint);
$("lang").addEventListener("change", updateModelHint);
checkDevice();

$("go").addEventListener("click", async () => {
  if (!picked) return;
  $("go").disabled = true;
  $("err").classList.add("hidden");
  $("err").className = "note err";
  $("result").classList.add("hidden");
  $("prog").classList.remove("hidden");
  $("fill").style.width = "2%";
  $("statusText").textContent = "소리를 읽는 중…";

  let audio;
  try {
    audio = await toMono16k(picked);
  } catch (e) { return showError(e.message); }

  if (audio.length < SAMPLE_RATE * 0.2) return showError("소리가 너무 짧습니다.");

  // 긴 녹음을 큰 모델로 돌리면 휴대폰이 오래 뜨거워진다. 미리 알리고 확인받는다.
  const minutes = audio.length / SAMPLE_RATE / 60;
  if (minutes > 3 && $("model").value.includes("large")) {
    const ok = confirm(
      `녹음이 ${minutes.toFixed(0)}분입니다.\n\n` +
        "가장 정확한 모델로 돌리면 휴대폰이 오래 뜨거워지고 느려질 수 있습니다.\n\n" +
        "확인을 누르면 그대로 진행하고,\n" +
        "취소를 누르면 멈춥니다. ('정확도' 를 낮추면 훨씬 가볍습니다)",
    );
    if (!ok) {
      $("prog").classList.add("hidden");
      $("go").disabled = false;
      return;
    }
  }

  const request = {
    audio,
    model: $("model").value,
    language: $("lang").value,
    sampleRate: SAMPLE_RATE,
    diarize: $("diarize").checked,
  };

  leftDuringWork = false;
  cancelled = false;
  window.__transcribing = true;   // 작업이 끝날 때까지 페이지를 새로고침하지 않는다
  diarizeSkipped = false;
  currentPhase = "";
  downloadBytes.clear();
  keepAwake();
  if ($("notify")?.checked) startKeepAlive();
  const big = $("model").value.includes("large");
  $("statusText").textContent = big
    ? "모델 준비 중… 처음이면 시간이 걸립니다. 이 화면을 그대로 두세요."
    : "모델 준비 중… (처음이면 시간이 걸립니다)";
  armStallNotice();

  // 1순위: 작업자에서 돌린다(화면이 멈추지 않는다).
  // 작업자가 뜨지 않는 브라우저라면 화면에서 직접 돌린다. 느리지만 동작은 한다.
  if (!workerFailed) {
    if (startWithWorker(request)) return;
    workerFailed = true;
  }
  runOnMainThread(request);
});

/* ---------- 배경에서 계속 돌리기 ---------- */

let keepAliveContext = null;

/**
 * 다른 앱으로 나가도 작업이 멈추지 않게 한다.
 *
 * 안드로이드 크롬은 가려진 채 '소리가 나지 않는' 탭을 약 5분 뒤 얼려 버린다.
 * 소리를 내는 탭은 예외다. 그래서 사람이 못 듣는 아주 작은 소리를 흘려 둔다.
 *
 * 주의: 소리 크기가 정확히 0 이면 소용이 없다. 실측 결과 크기 0 은 소리가
 * 없는 것과 똑같이 취급되어 그대로 멈췄고(초당 1회), 0.001 로 두자
 * 가려진 상태에서도 그대로 돌았다(초당 240회).
 *
 * 아이폰은 이 방법으로도 안 된다. 화면을 벗어나면 그냥 멈춘다.
 */
function startKeepAlive() {
  if (keepAliveContext) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const context = new Ctx();
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    gain.gain.value = 0.001;      // 들리지 않지만 '소리 없음' 으로도 치지 않는 크기
    oscillator.frequency.value = 60;
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start();
    keepAliveContext = context;
    // 파일을 읽는 동안 시간이 흘러 자동 재생 허가가 식었을 수 있다. 한 번 깨운다.
    if (context.state === "suspended") context.resume().catch(() => {});
  } catch {
    // 안 되는 브라우저에서도 작업 자체에는 지장이 없다.
  }
}

function stopKeepAlive() {
  try { keepAliveContext?.close(); } catch {}
  keepAliveContext = null;
}

/* ---------- 휴대폰 알림 ---------- */

/**
 * 이 알림은 '지금 이 페이지가 살아 있을 때' 울리는 알림이다.
 * 카톡처럼 서버가 밀어 주는 알림(푸시)이 아니다.
 * 다만 받아쓰기 자체가 이 페이지에서 도는 것이라, 페이지가 죽으면 작업도 같이
 * 멈춘다. 즉 '작업이 끝났다' 는 알림은 작업이 끝날 수 있는 상황에서는 항상 뜬다.
 */
function canNotify() {
  return typeof Notification !== "undefined" && window.isSecureContext;
}

async function askNotifyPermission() {
  if (!canNotify()) return "unsupported";
  if (Notification.permission === "granted") return "granted";
  if (Notification.permission === "denied") return "denied";
  try {
    return await Notification.requestPermission();   // 사용자가 체크한 그 순간에만 물을 수 있다
  } catch {
    return "denied";
  }
}

/** 서비스 워커를 통해 알림을 띄운다. 안드로이드 크롬은 이 방법만 허용한다. */
async function showNotice(title, body, quiet = false) {
  if (!canNotify() || Notification.permission !== "granted") return;
  const options = {
    body,
    // 같은 표를 달아 두면 알림이 쌓이지 않고 하나가 갱신된다.
    // (실측: 같은 표로 40번 띄워도 알림함에는 1개만 남고 내용만 바뀐다)
    tag: "voice-record",
    // 진행 중에는 소리·진동 없이 내용만 바꾸고, 끝나거나 실패했을 때만 알린다.
    renotify: !quiet,
    silent: quiet,
    icon: "icon-192.png",
  };
  try {
    if (navigator.serviceWorker) {
      // 서비스 워커가 없거나 늦으면 영영 기다릴 수 있어 시간 제한을 둔다.
      const registration = await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((resolve) => setTimeout(() => resolve(null), 3000)),
      ]);
      if (registration?.showNotification) {
        await registration.showNotification(title, options);
        return;
      }
    }
    new Notification(title, options);   // 데스크톱 대비책
  } catch {
    // 알림은 덤이다. 실패해도 받아쓰기에는 지장이 없다.
  }
}

/**
 * 다른 앱을 보고 있는 동안 진행 상황을 알림 한 줄로 갱신해 준다.
 *
 * 완료 알림과 같은 표를 쓰므로 알림이 쌓이지 않고 한 줄이 계속 바뀐다.
 * 새 타이머를 만들지 않고 작업자가 보내오는 진행 소식에 얹는다.
 * (배경 탭에서는 타이머가 분당 1회로 떨어져 쓸 수 없다)
 */
let lastProgressNotice = 0;
function showProgressNotice(body) {
  if (!wantsNotice()) return;
  if (!document.hidden) return;                          // 보고 있으면 군더더기다
  if (Date.now() - lastProgressNotice < 15000) return;   // 15초에 한 번까지
  lastProgressNotice = Date.now();
  showNotice("받아쓰는 중", body, true);                  // 조용히 갱신만
}

function wantsNotice() {
  return $("notify")?.checked && canNotify() && Notification.permission === "granted";
}

if (canNotify()) {
  $("notifyRow").style.display = "flex";
  $("notify").addEventListener("change", async () => {
    if (!$("notify").checked) { $("notifyNote").classList.add("hidden"); return; }
    const result = await askNotifyPermission();
    const note = $("notifyNote");
    note.classList.remove("hidden");
    if (result === "granted") {
      note.innerHTML =
        "다른 앱을 써도 계속 돌아가고, 다 되면 알림이 옵니다.<br />" +
        "멈추지 않게 <b>들리지 않는 소리</b>를 재생하므로 브라우저에 소리 표시가 뜹니다.<br />" +
        "<b>아이폰은</b> 화면을 벗어나면 멈춥니다. 이 화면을 켜 둔 채로 두세요.";
    } else {
      $("notify").checked = false;
      note.textContent =
        result === "denied"
          ? "알림이 차단되어 있습니다. 브라우저 설정에서 이 사이트의 알림을 허용해 주세요."
          : "이 브라우저는 알림을 지원하지 않습니다. 아이폰은 홈 화면에 추가해야 알림이 됩니다.";
    }
  });
} else {
  // 아이폰 사파리는 홈 화면에 추가해야 알림을 쓸 수 있다(iOS 16.4 이상).
  const row = $("notifyRow");
  if (row) row.style.display = "none";
}

let wakeLock = null;
let leftDuringWork = false;
// 작업 중에는 서비스 워커가 페이지를 새로고침하지 못하게 막는 표시
window.__transcribing = false;

/** 처리하는 동안 화면이 꺼지지 않게 한다. 화면이 꺼지면 다운로드가 끊긴다. */
async function keepAwake() {
  if (wakeLock && !wakeLock.released) return;   // 이미 걸려 있으면 또 걸지 않는다
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch {
    // 화면이 가려진 동안에는 브라우저가 거절한다. 없어도 동작에는 지장 없다.
  }
}

function releaseAwake() {
  try { wakeLock?.release(); } catch {}
  wakeLock = null;
}

// 처리 중에 다른 앱으로 나갔는지 기억해 둔다(오류 원인 안내에 쓴다).
document.addEventListener("visibilitychange", () => {
  if (document.hidden && !$("prog").classList.contains("hidden")) leftDuringWork = true;
  // 돌아왔을 때 화면 꺼짐 방지를 다시 건다.
  if (!document.hidden && !$("prog").classList.contains("hidden")) {
    keepAwake();
    if (keepAliveContext?.state === "suspended") keepAliveContext.resume().catch(() => {});
  }
});

/** 기계가 뱉는 영어 오류를 사람이 알아들을 말로 바꾼다. */
function friendlyError(message) {
  const raw = String(message || "");
  const lower = raw.toLowerCase();
  if (lower.includes("network") || lower.includes("failed to fetch") || lower.includes("load")) {
    return (
      "다운로드가 중간에 끊겼습니다.\n\n" +
      (leftDuringWork
        ? "받는 도중에 다른 화면으로 나가셨습니다. 휴대폰은 화면을 벗어나면 다운로드를 멈춥니다.\n"
        : "") +
      "이렇게 해보세요:\n" +
      "  1. 와이파이에 연결하기\n" +
      "  2. 다시 누르고 이 화면을 그대로 두기 (끝날 때까지)\n" +
      "  3. 계속 안 되면 '정확도' 를 낮춰서 더 작은 것부터 받기\n\n" +
      `(원인: ${raw})`
    );
  }
  if (lower.includes("out of memory") || lower.includes("allocation")) {
    return (
      "휴대폰 메모리가 부족합니다.\n" +
      "'정확도' 를 한 단계 낮춰서 다시 시도해 주세요.\n\n" +
      `(원인: ${raw})`
    );
  }
  return raw;
}

/**
 * 오래 조용할 때 "멈춘 게 아니다" 라고 알려 준다.
 *
 * 예전에는 20초가 지나면 무조건 "모델을 내려받는 중" 이라고 띄웠는데,
 * 이미 다 받고 받아쓰는 중일 때도 그렇게 나와 사실과 달랐다.
 * 지금 단계에 맞는 문구만 쓴다.
 */
function armStallNotice() {
  clearTimeout(stallTimer);
  stallTimer = setTimeout(() => {
    if ($("prog").classList.contains("hidden")) return;
    const hint = {
      loading: "모델을 준비하는 중입니다. 이 화면을 그대로 두세요…",
      transcribing: planTotal
        ? "받아쓰는 중입니다. 구간이 많아 시간이 걸립니다…"
        : "받아쓰는 중입니다. 녹음이 길면 시간이 걸립니다…",
      diarizing: "화자를 구분하는 중입니다…",
    }[currentPhase];
    if (hint) $("statusText").textContent = hint;
  }, 25000);
}

/** 작업자로 시작한다. 만들지 못하면 false. */
function startWithWorker(request) {
  if (typeof Worker === "undefined") return false;
  if (!worker) {
    try {
      // 주소에 버전을 붙여 예전 파일이 캐시에서 나오는 것을 막는다.
      const url = new URL(`./worker.js?v=${APP_VERSION}`, import.meta.url);
      worker = new Worker(url, { type: "module" });
    } catch {
      return false;                       // 모듈 작업자를 지원하지 않는 브라우저
    }
    worker.addEventListener("message", onWorker);
    // 작업자가 죽으면 반드시 버린다. 그대로 두면 다음 시도에서 죽은 작업자에게
    // 말을 걸게 되어 '모델 준비 중' 에서 영영 멈춘다.
    worker.addEventListener("error", () => {
      killWorker();
      workerFailed = true;
      $("statusText").textContent = "다른 방식으로 다시 시도합니다…";
      runOnMainThread(request);           // 원인을 따지지 말고 우회한다
    });
    worker.addEventListener("messageerror", () => {
      killWorker();
      workerFailed = true;
      runOnMainThread(request);
    });
  }
  worker.postMessage(request);
  return true;
}

/** 화면 쪽에서 직접 돌린다(작업자를 못 쓸 때의 대비책). */
async function runOnMainThread(request) {
  if (mainThreadBusy) return;
  mainThreadBusy = true;
  onMainThread = true;
  try {
    const { runTranscription } = await import(`./engine.js?v=${APP_VERSION}`);
    const result = await runTranscription(request, (e) => onWorker({ data: e }));
    onWorker({ data: result });
  } catch (error) {
    showError(String(error?.message || error));
  } finally {
    mainThreadBusy = false;
  }
}

function onWorker(event) {
  if (cancelled) return;          // 중지한 뒤 뒤늦게 오는 결과는 버린다
  const d = event.data;
  if (d.type === "download") {
    // 파일마다 크기가 다르므로 받은 바이트 합계로 계산해야 정확하다.
    downloadBytes.set(d.file, { loaded: d.loaded, total: d.total });
    let loaded = 0, total = 0;
    for (const v of downloadBytes.values()) { loaded += v.loaded; total += v.total; }
    const ratio = total > 0 ? loaded / total : 0;
    $("fill").style.width = `${5 + ratio * 45}%`;
    const mb = (n) => (n / 1048576).toFixed(0);
    $("statusText").textContent =
      `모델 내려받는 중… ${Math.round(ratio * 100)}%  (${mb(loaded)} / ${mb(total)} MB)`;
    $("firstRun").classList.add("hidden");
    armStallNotice();
  } else if (d.type === "device") {
    // 느릴 때 원인을 바로 알 수 있게, 실제로 무엇으로 도는지 그대로 쓴다.
    $("statusText").textContent = d.device === "webgpu"
      ? "빠른 모드(그래픽 가속)로 처리합니다"
      : `처리 중… (CPU ${d.threads}개 사용)`;
  } else if (d.type === "plan") {
    // 말이 있는 부분만 골라 냈다는 걸 알려 준다.
    const skipped = Math.max(0, d.totalSeconds - d.speechSeconds);
    planTotal = d.windows;
    $("statusText").textContent =
      `받아쓸 구간 ${d.windows}개` +
      (skipped > 3 ? ` (조용한 ${fmtTime(skipped)} 는 건너뜁니다)` : "");
  } else if (d.type === "progress") {
    const ratio = d.total > 0 ? d.done / d.total : 0;
    $("fill").style.width = `${55 + ratio * 35}%`;
    const left = d.remaining != null && d.remaining > 3
      ? ` · 약 ${fmtTime(d.remaining)} 남음`
      : "";
    $("statusText").textContent = `받아쓰는 중… ${d.done}/${d.total} 구간${left}`;
    showProgressNotice(`${Math.round(ratio * 100)}%  ${d.done}/${d.total} 구간${left}`);
    armStallNotice();
  } else if (d.type === "download-done") {
    downloaded.set(d.file, 1);
  } else if (d.type === "diarize-progress") {
    $("fill").style.width = `${90 + (d.done / Math.max(1, d.total)) * 8}%`;
    $("statusText").textContent = `화자를 구분하는 중… ${d.done}/${d.total}`;
    showProgressNotice(`화자 구분 중 ${d.done}/${d.total}`);
  } else if (d.type === "phase") {
    currentPhase = d.phase;
    if (d.phase === "loading") {
      $("statusText").textContent = "모델 준비 중…";
    } else if (d.phase === "transcribing") {
      // 여기서 화면 꺼짐 방지를 풀면 안 된다. 받아쓰기가 제일 오래 걸리는데
      // 그 사이에 화면이 자동으로 꺼지면 작업이 멈춘다(아이폰은 특히 빨리).
      $("fill").style.width = "55%";
      planTotal = 0;
      $("statusText").textContent = onMainThread
        ? "받아쓰는 중… (이 기기에서는 화면이 잠시 멈출 수 있습니다)"
        : "받아쓰는 중…";
    } else if (d.phase === "diarizing") {
      $("fill").style.width = "90%";
      $("statusText").textContent = "화자를 구분하는 중…";
    } else if (d.phase === "gpu-lost") {
      // 배경에 오래 있으면 안드로이드가 그래픽 메모리를 회수해 간다.
      $("statusText").textContent = "그래픽 가속이 끊겨 일반 모드로 이어서 합니다…";
    } else if (d.phase === "retrying") {
      $("statusText").textContent = "다른 방식으로 다시 시도합니다…";
    } else if (d.phase === "diarize-skipped") {
      // 잘못 추측하느니 빼는 편이 낫다. 사용자에게 사실대로 알린다.
      diarizeSkipped = true;
      $("statusText").textContent = "화자 구분을 하지 못했습니다 (받아쓰기는 그대로 나옵니다)";
    }
    armStallNotice();
  } else if (d.type === "done") {
    $("fill").style.width = "100%";
    showResult(d);
  } else if (d.type === "error") {
    killWorker();          // 한 번 실패한 작업자는 버린다(다음 시도가 멈추지 않도록)
    showError(d.message);
  }
}

/** 화자가 나뉘었으면 화자별로, 아니면 그냥 텍스트로 정리한다. */
function formatResult(d) {
  const chunks = d.chunks || [];
  if (!chunks.length) return d.text || "(말소리를 찾지 못했습니다)";
  if (!chunks.some((c) => c.speaker)) return d.text || "(말소리를 찾지 못했습니다)";
  // 한 사람만 말했으면 [화자1] 머리말은 군더더기다.
  if (new Set(chunks.map((c) => c.speaker)).size < 2) {
    return d.text || chunks.map((c) => c.text).join("\n");
  }

  const lines = [];
  let current = null;
  for (const chunk of chunks) {
    if (chunk.speaker !== current) {
      current = chunk.speaker;
      lines.push(`\n[${current}]`);
    }
    lines.push(chunk.text);
  }
  return lines.join("\n").trim();
}

$("stop").addEventListener("click", () => {
  window.__transcribing = false;
  stopKeepAlive();
  cancelled = true;
  killWorker();                 // 작업자를 즉시 끝낸다
  releaseAwake();
  mainThreadBusy = false;
  clearTimeout(stallTimer);
  $("prog").classList.add("hidden");
  $("go").disabled = !picked;
  $("err").classList.remove("hidden");
  $("err").className = "note warn";
  $("err").textContent =
    "중지했습니다.\n" +
    "화면에서 직접 처리 중이었다면 잠시 뒤에 멈춥니다. " +
    "완전히 멈추려면 이 탭을 닫았다 다시 여세요.";
});

function killWorker() {
  clearTimeout(stallTimer);
  if (worker) { try { worker.terminate(); } catch {} }
  worker = null;
  downloaded.clear();
}

function showError(message) {
  window.__transcribing = false;
  stopKeepAlive();
  if (wantsNotice()) showNotice("받아쓰기가 중간에 멈췄습니다", friendlyError(message).split("\n")[0]);
  releaseAwake();
  $("prog").classList.add("hidden");
  $("err").classList.remove("hidden");
  $("err").textContent = "❌ " + friendlyError(message);
  $("go").disabled = !picked;
}

function showResult(d) {
  window.__transcribing = false;
  stopKeepAlive();
  if (wantsNotice()) {
    showNotice(
      "받아쓰기가 끝났습니다",
      `${fmtTime(d.duration)} 분량` + (d.speakers > 1 ? ` · 화자 ${d.speakers}명` : "") +
        " — 눌러서 결과를 확인하세요",
    );
  }
  releaseAwake();
  $("prog").classList.add("hidden");
  $("go").disabled = false;
  lastResult = d;
  $("out").value = formatResult(d);
  const speed = d.duration > 0 && d.elapsed > 0 ? (d.duration / d.elapsed).toFixed(1) : "?";
  $("rmeta").innerHTML =
    `길이 <b>${fmtTime(d.duration)}</b>` +
    `처리 <b>${d.elapsed.toFixed(0)}초</b>` +
    `속도 <b>x${speed}</b>` +
    (d.speakers > 1 ? `화자 <b>${d.speakers}명</b>` : "") +
    // 화자 구분을 못 했으면 조용히 넘기지 않고 사실대로 알린다.
    (diarizeSkipped
      ? `<span style="color:var(--warn)">화자 구분 실패 (인터넷 확인 후 다시)</span>`
      : "") +
    `모드 <b>${d.device === "webgpu" ? "WebGPU (빠름)" : "일반 (느림)"}</b>` +
    (onMainThread ? `<span style="color:var(--warn)">화면에서 직접 처리(느림)</span>` : "");
  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("out").value);
    $("copy").textContent = "✅ 복사됨";
  } catch {
    $("out").select();                 // 클립보드가 막힌 경우 직접 선택하게 한다
    $("copy").textContent = "길게 눌러 복사하세요";
  }
  setTimeout(() => $("copy").textContent = "📋 복사", 1800);
});

$("save").addEventListener("click", async () => {
  const name = (picked?.name || "받아쓰기").replace(/\.[^.]+$/, "") + ".txt";
  // 한글이 깨지지 않게 두 가지를 맞춰 준다.
  //  1) 맨 앞에 BOM(\uFEFF): 없으면 윈도우 메모장·엑셀이 UTF-8 인 줄 모르고
  //     cp949 로 읽어 "ìëíì¸ì" 처럼 깨진다.
  //  2) 줄바꿈을 CRLF 로: 옛 메모장은 LF 만 있으면 전부 한 줄로 붙여 버린다.
  const text = "\uFEFF" + $("out").value.replace(/\r?\n/g, "\r\n");
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });

  // 휴대폰에서는 '공유' 로 내보내는 편이 확실하다.
  // 카톡·메일로 바로 보낼 수 있고, 홈 화면에 추가한 아이폰 앱에서는
  // 그냥 내려받기가 동작하지 않는 경우가 있다.
  try {
    const file = new File([blob], name, { type: "text/plain" });
    if (navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (error) {
    if (error?.name === "AbortError") return;   // 사용자가 공유를 취소했다
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
