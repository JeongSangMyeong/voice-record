[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicescribe"
version = "0.1.0"
description = "녹음 파일을 100개 언어의 텍스트로 바꾸는 무료·오프라인 받아쓰기 도구 (클로바노트 대안)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["speech-to-text", "transcription", "whisper", "korean", "stt", "subtitle", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# 핵심 의존성은 numpy 하나뿐이다. 무거운 것은 모두 선택 설치(extras)로 뺀다.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# 오디오 디코딩(mp3/m4a/webm/ogg). PyAV 휠에 FFmpeg 가 내장되어 별도 설치가 필요 없다.
audio = ["av>=12", "soundfile>=0.12"]
# 실제 음성인식(권장). 100개 언어.
stt = ["faster-whisper>=1.0", "av>=12", "soundfile>=0.12"]
# 한·일·중·영·광둥어 고속 엔진 + 화자 분리(PyTorch 불필요, 약 45MB).
fast = ["sherpa-onnx>=1.10", "av>=12", "soundfile>=0.12"]
# 예비 엔진(PyTorch 필요, 용량 큼).
stt-openai = ["openai-whisper>=20231117"]
# 오프라인 번역. 주의: argostranslate 는 stanza 를 거쳐 PyTorch·CUDA 까지 끌어와
# GPU 가 없어도 수 GB 를 설치한다. 가볍게 쓰려면 README 의 '슬림 설치' 절을 참고할 것.
translate = ["argostranslate>=1.9"]
# 정확한 신경망 번역(용량 큼).
translate-hf = ["transformers>=4.40", "torch>=2.0", "sentencepiece>=0.2"]
# 최고 정확도 화자 분리(HF 무료 토큰 필요). 없어도 sherpa/간이 방식이 동작한다.
diarize = ["pyannote.audio>=3.1", "torch>=2.0"]
# 브라우저 UI.
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
# 휴대폰에서 접속하기(접속용 QR 표시, 마이크 녹음을 위한 https).
lan = ["segno>=1.6", "cryptography>=42"]
# Claude Code 등 MCP 클라이언트 연동.
mcp = ["mcp>=1.0"]
# 개발용.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]
# 한 번에 다 설치(PyTorch 계열은 일부러 제외 — 용량이 수 GB 늘어난다).
all = [
    "faster-whisper>=1.0", "av>=12", "soundfile>=0.12",
    "sherpa-onnx>=1.10",
    "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9",
    "segno>=1.6", "cryptography>=42",
    "mcp>=1.0",
]

[project.scripts]
voicescribe = "voicescribe.cli:main"
voicescribe-mcp = "voicescribe.mcp_server:main"

[project.urls]
Homepage = "https://github.com/JeongSangMyeong/JeongSangMyeong"
Repository = "https://github.com/JeongSangMyeong/JeongSangMyeong"

[tool.hatch.build.targets.wheel]
packages = ["src/voicescribe"]

[tool.hatch.build.targets.wheel.force-include]
"src/voicescribe/web/index.html" = "voicescribe/web/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# FastAPI 는 File()/Form() 을, Gradio 는 Progress() 를 인자 기본값으로 쓰도록
# 설계되어 있다(B008 은 여기서 오탐).
"src/voicescribe/web/server.py" = ["B008"]
"deploy/huggingface/app.py" = ["B008"]
